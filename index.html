<style>
:root{
  --bg:#f4f1ea; --surface:#fffdf8; --ink:#1f2a24; --muted:#6a746d; --line:#ddd6c6;
  --accent:#1f6b4a; --accent-ink:#fff; --warn:#b4541a; --zone:#2f7a5a; --you:#c0392b;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141815; --surface:#1d231f; --ink:#e8ece6; --muted:#98a39b; --line:#2c352f;
    --accent:#4fb284; --accent-ink:#0c1410; --warn:#e0884f; --zone:#4fb284; --you:#ff6b5a;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));
  background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-size:1rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:10px 2px;font:inherit;font-size:.72rem;position:relative}
nav button b{display:block;font-size:1.15rem;font-weight:400}
nav button[aria-selected=true]{color:var(--accent);font-weight:600}
nav .dot{position:absolute;top:6px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--warn);
  color:#fff;font-size:.65rem;line-height:16px;padding:0 4px}
button.btn,label.btn,a.btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  padding:11px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-align:center}
button.btn.ghost,label.btn.ghost,a.btn.ghost{background:none;color:var(--accent)}
button.btn:disabled{opacity:.45}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px;width:100%;text-align:left;font:inherit;color:inherit}
.item img{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none}
.item .t{flex:1;min-width:0}.item .t b{display:block}.item .t small{color:var(--muted)}
.arrow{width:30px;height:30px;flex:none;transition:transform .3s}
.muted{color:var(--muted)} .center{text-align:center}
.empty{color:var(--muted);text-align:center;padding:32px 0}
.hero{max-width:520px;margin:6vh auto 0;text-align:center}
.hero h2{margin:.2em 0}
.hero img{max-width:100%;max-height:36vh;border-radius:14px;margin:12px 0}
.desc{white-space:pre-wrap;word-wrap:break-word}
.detail img{max-width:100%;border-radius:12px;margin:8px 0}
.cmds{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.back{background:none;border:0;color:var(--accent);font:inherit;padding:0 0 10px;font-weight:600}
canvas{width:100%;height:46vh;min-height:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;touch-action:none;display:block}
.ctl{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px}
.pad button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font-size:1.2rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:8px 12px;font:inherit;font-size:.85rem}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal .card{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.modal{align-items:center}.modal .card{border-radius:18px}}
.card img{max-width:100%;max-height:34vh;display:block;margin:0 auto 12px;border-radius:10px}
.card .btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.card input[type=text]{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:12px}
pre.log{font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:10px;margin:0}
.err{color:var(--warn)}
[hidden]{display:none!important}
a.btn{display:inline-block;text-decoration:none}
.btn.sm{padding:7px 12px;font-size:.85rem}
.iconbtn{border:0;background:none;color:var(--ink);font-size:1.5rem;line-height:1;padding:4px 10px;border-radius:8px}
#mapbox{height:46vh;min-height:260px;border:1px solid var(--line);border-radius:12px;position:relative;z-index:0}
.leaflet-container{font:inherit}
.zlabel{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:12px;padding:1px 6px;box-shadow:none}
.zlabel:before{display:none}
.item.col{flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;width:100%}
.coffee{border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;background:var(--bg)}
.small{font-size:.85rem}
.hero .btn{min-width:240px}
</style>

/**
 * Abstract object that fires events.

	var listeners = this._listeners[name],
		result,
		i;

		if (listeners.hasOwnProperty(i)) {
			result = listeners[i].apply(this, data);
			if (result !== undefined && !result) break;

	}

 * @param {Function} Callback Listener function to be removed.

'use strict';


var shine = shine || {};


/**
 * Handles loading packages and distilled scripts.
 * @constructor
 * @extends shine.EventEmitter
 */
shine.FileManager = function () {
	shine.EventEmitter.call(this);
	this._cache = {};
};


shine.FileManager.prototype = new shine.EventEmitter();
shine.FileManager.prototype.constructor = shine.FileManager;




/**
 * Loads a file or package.
 * @param {String|Object} url Url of distilled json file or luac byte code file, or the json or byte code itself, or an object tree.
 * @param {Function} callback Load successful callback.
 */
shine.FileManager.prototype.load = function (url, callback) {
	var me = this,
		data;


	function parse (data, url) {
		var tree;

		if (me.constructor._isJson(data)) {
			// JSON
			tree = JSON.parse(data);

		} else if (me.constructor._isLuac(data)) {
			// Raw Lua 5.1 byte code
			tree = me.constructor._parseLuac(data);
		}

		if (tree) {
			window.setTimeout(function () {		// Make sure all calls are async.
				if (url) me._cache[url] = tree;
				me._onSuccess(url || '', tree, callback);
			}, 1);
		}

		return !!tree;
	}


	function success (data) {
		if (!parse(data, url)) throw new Error('File contains non-parsable content: ' + url);
	}


	function error (code) {
		me._onError(code, callback);
	}


	switch (typeof url) {
		case 'string':

			if (!parse(url)) {
				// If not parseable, treat as filename
				if (data = this._cache[url]) {
					window.setTimeout(function () { me._onSuccess(url, data, callback); }, 1);
				} else {
					shine.utils.get(url, success, error);
				}
			}

			break;

	
		case 'object':
			this._onSuccess('', url, callback);
			break;


		default: 
			throw new TypeError('Can\'t load object of unknown type');
	}
};




/**
 * Handles a successful response from the server.
 * @param {String} data Response.
 */
shine.FileManager.prototype._onSuccess = function (url, data, callback) {
	var file, i;

	if (data.format == 'moonshine.package') {
		for (i in data.files) this._cache[i] = data.files[i];
		this._trigger('loaded-package', data);

		if (!(url = data.main)) return;
		if (!(data = data.files[url])) throw new ReferenceError("The package's main reference does not point to a filename within the package");
	}

	file = new shine.File(url, data);
	
	this._onFileLoaded(file, function () {
		callback(null, file);
	});
};




/**
 * Hook called when a distilled file is loaded successfully. Overridden by debug engine.
 * @param {String} data Response.
 */
shine.FileManager.prototype._onFileLoaded = function (file, callback) {
	callback();
};




/**
 * Handles an unsuccessful response from the server. Overridden by debug engine.
 * @param {Number} code HTTP resonse code.
 */
shine.FileManager.prototype._onError = function (code, callback) {
	callback(code);
};




/**
 * Checks if a value represents a JSON string.
 * @param {String} val String to be checked.
 * @returns {Boolean} Is a JSON string?
 */
shine.FileManager._isJson = function (val) {
	return /^({.*}|\[.*\])$/.test(val);
};




/**
 * Checks if a value represents a Lua 5.1 byte code.
 * @param {String} val String to be checked.
 * @returns {Boolean} Is byte code?
 */
shine.FileManager._isLuac = function (val) {
	return val.substr(0, 5) == String.fromCharCode(27, 76, 117, 97, 81);
};




/**
 * Parses a string containing valid Lua 5.1 byte code into a tree.
 * Note: Requires Moonshine Distillery and could return unexpected results if ArrayBuffer is not supported.
 * @param {String} data Byte code string.
 * @returns {Object} Tree repesenting the Lua script.
 * @throws {Error} If Moonshine's distillery is not available.
 */
shine.FileManager._parseLuac = function (data) {
	if (!shine.distillery) throw new Error('Moonshine needs the distillery to parse Lua byte code. Please include "distillery.moonshine.js" in the page.');
	if (!('ArrayBuffer' in window)) console.warn('Browser does not support ArrayBuffers, this could cause unexpected results when loading binary files.');
	return new shine.distillery.Parser().parse(data);
};




/**
 * Dump memory associated with FileManager.
 */
shine.FileManager.prototype.dispose = function () {
	delete this._cache;
};

/* ------------------------------------------------------------------ GWC parser */
function parseGWC(buf){
  const dv = new DataView(buf), u8a = new Uint8Array(buf);
  const sig = [2,10,0x43,0x41,0x52,0x54,0];
  for (let i=0;i<7;i++) if (u8a[i] !== sig[i]) throw new Error(t('err.notGwc'));
  const n = dv.getUint16(7, true);
  const table = [];
  for (let i=0;i<n;i++) table.push({ id: dv.getUint16(9+i*6, true), off: dv.getUint32(11+i*6, true) });
  // object 0 = Lua bytecode: u32 length + data (no validity byte / type)
  const lo = table[0].off, llen = dv.getUint32(lo, true);
  let lua = '';
  const bytes = u8a.subarray(lo+4, lo+4+llen);
  for (let i=0;i<bytes.length;i+=8192) lua += String.fromCharCode.apply(null, bytes.subarray(i, i+8192));
  const medias = {};
  const MIME = {1:'image/bmp',2:'image/png',3:'image/jpeg',4:'image/gif',17:'audio/wav',18:'audio/mpeg',19:'audio/x-fdl',20:'audio/x-snd',21:'audio/ogg'};
  for (let i=1;i<n;i++){
    const o = table[i].off;
    if (!u8a[o]) continue;                             // invalid object
    const type = dv.getInt32(o+1, true), len = dv.getUint32(o+5, true);
    medias[table[i].id] = { type, mime: MIME[type] || 'application/octet-stream',
      blob: new Blob([u8a.slice(o+9, o+9+len)], { type: MIME[type] || 'application/octet-stream' }) };
  }
  return { lua, medias, count: n };
}

function mediaUrl(idx){
  if (!idx) return '';
  if (state.urls[idx] === undefined){
    const m = state.medias[idx];
    state.urls[idx] = (m && m.mime.startsWith('image/')) ? URL.createObjectURL(m.blob) : '';
  }
  return state.urls[idx];
}

function callLua(name, ...args){
  try {
    const f = vm._globals[name];
    if (!f) throw new Error('missing Lua function '+name);
    const r = f.apply(null, args);
    return r && r[0];
  } catch(e){ log(t('log.lua', {n: name, m: (e && e.message || e)}), true); return undefined; }
}

function loadChunk(str){
  return new Promise((res, rej) => {
    vm.fileManager.load(str, (err, file) => {
      if (err) return rej(new Error(t('err.bytecode', {e: err})));
      try { vm.execute(undefined, file); res(); } catch(e){ rej(e); }
    });
  });
}

  vm.setGlobal('__H_message', (id, text, media, buttons) => showMessage(id, u8(text), media, u8(buttons).split('\x1f')));
  vm.setGlobal('__H_input', (id, text, media, kind, choices) => showInput(id, u8(text), media, kind, u8(choices).split('\x1f').filter(Boolean)));

    const o = {};

    return new shine.Table(o);
  });
  vm.setGlobal('__H_setglobal', (k, v) => { vm._globals[k] = v; });
  state.key = hashStr(gwc.lua) + '-' + gwc.lua.length;
  await loadChunk(b64bin(WHERIGO_LUAC_B64));
  await loadChunk(gwc.lua);
  refresh(true);
  state.tab = 'intro'; render();
}

function beginPlay(resume){
  state.started = true; state.endShown = false;
  ls.set('wheremego:last', state.key); ls.set('wheremego:played:' + state.key, String(Date.now()));
  if (!resume) ls.del('wheremego:done:' + state.key);
  $('#nav').hidden = false; $('#modeSeg').hidden = false;
  state.tab = 'map';
  const sv = resume ? getSave() : null;
  if (sv){
    try {
      callLua('__W_restore', new shine.Table(JSON.parse(sv.data)));
      state.pos = sv.pos || null;
      if (state.pos) setPos(state.pos.lat, state.pos.lon, state.pos.acc);
      log(t('log.restored', {d: new Date(sv.t).toLocaleString(locale())}));
    } catch(e){ log(t('log.restoreFail', {m: e.message}), true); }
    setMode(state.mode, true);
  } else {
    clearSave(); state.pos = null;
    setMode(state.mode, true);
    callLua('__W_start');
  }
  lastTick = Date.now();
  timer = setInterval(() => { tickNow(); refresh(); }, 1000);
  saveInterval = setInterval(doSave, 20000);
  acquireWakeLock();
  refresh(true);
}

/* ---- time: tick with real elapsed seconds so timers catch up after the page was in the background ---- */
function tickNow(){
  const now = Date.now(), dt = Math.min((now - lastTick) / 1000, 6 * 3600); lastTick = now;
  if (dt > 0) callLua('__W_tick', dt);
}
async function acquireWakeLock(){
  try {
    if (!navigator.wakeLock || !state.started || document.hidden || wakeLock) return;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch(e){ log(t('log.wake', {m: e.message})); }
}

/* ---- audio ---- */
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
let audioUnlocked = false;
function unlockAudio(){ if (audioUnlocked) return; audioUnlocked = true; try { const a = new Audio(SILENT_WAV); a.play().catch(() => {}); } catch(e){} }
document.addEventListener('pointerdown', unlockAudio, { once: true });
function isAudio(idx){ const m = state.medias[idx]; return !!(m && m.mime.startsWith('audio/')); }
function stopAudio(){ if (audioEl){ try { audioEl.pause(); } catch(e){} audioEl = null; } }
function playAudio(idx){
  const m = state.medias[idx];
  if (!m) { log(t('log.audioMissing', {i: idx}), true); return; }
  if (!m.mime.startsWith('audio/')) return;
  const names = { 17: 'WAV', 18: 'MP3', 19: 'FDL (Garmin)', 20: 'SND', 21: 'OGG' };
  if (m.type === 19 || m.type === 20 || !new Audio().canPlayType(m.mime)){
    log(t('log.audioUnsupported', {i: idx, n: names[m.type] || m.mime}), true); return; }
  stopAudio();
  try {
    audioEl = new Audio(URL.createObjectURL(m.blob));
    audioEl.play().catch(e => log(t('log.audioPlay', {m: e.message}), true));
  } catch(e){ log('Audio: ' + e.message, true); }
}

function hashStr(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0).toString(16); }
function getSave(){ try { const r = localStorage.getItem('wherigo:'+state.key); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function doSave(){
  if (!vm || !state.started) return;
  const raw = callLua('__W_save'); if (typeof raw !== 'string' || !raw) return;
  try { localStorage.setItem('wherigo:'+state.key, JSON.stringify({ t: Date.now(), pos: state.pos, data: raw })); state.savedAt = Date.now(); }
  catch(e){ log(t('log.saveFail', {m: e.message}), true); }
}
function clearSave(){ try { localStorage.removeItem('wherigo:'+state.key); } catch(e){} }
let saveTimer = null;
function saveSoon(){ if (saveTimer) return; saveTimer = setTimeout(() => { saveTimer = null; doSave(); }, 3000); }
window.addEventListener('pagehide', doSave);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) doSave();
  else if (state.started && vm){ tickNow(); refresh(); acquireWakeLock(); }
});

function stopAll(){
  if (timer) clearInterval(timer); timer = null;
  if (saveInterval) clearInterval(saveInterval); saveInterval = null;
  stopAudio(); if (wakeLock){ try { wakeLock.release(); } catch(e){} wakeLock = null; }
  if (gpsWatch != null && navigator.geolocation) navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null;
  $('#modal').hidden = true;
}

function refresh(force){
  if (!vm) return;
  const raw = callLua('__W_snapshot');
  if (typeof raw !== 'string') return;
  if (!force && raw === state.snapJson && !state.screenReq) return;
  state.snapJson = raw; saveSoon();
  try { state.snap = JSON.parse(u8(raw)); } catch(e){ log('Snapshot parse: '+e.message, true); return; }
  if (state.screenReq){ applyScreen(state.screenReq); state.screenReq = null; }
  render();
  if (state.started && !state.endShown && state.snap.cart && state.snap.cart.complete && !isDone(state.key) && $('#modal').hidden){
    state.endShown = true; ls.set('wheremego:done:' + state.key, '1'); showEnd();
  }
}

function applyScreen({screen, id}){
  const map = {0:'map', 1:'zones', 2:'yousee', 3:'inv', 4:'tasks'};
  if (screen === 5 && id) { state.detail = id; }
  else if (map[screen]) { state.tab = map[screen]; state.detail = null; }
}

/* ------------------------------------------------------------------ position */
function setPos(lat, lon, acc){
  state.pos = { lat, lon, acc: acc || 5 };
  callLua('__W_pos', lat, lon, acc || 5);
  refresh(true);
}
function setMode(mode, quiet){
  state.mode = mode; if (mapWrap) syncMapControls();
  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  if (gpsWatch != null){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; }
  if (mode === 'gps'){
    if (!navigator.geolocation){ log(t('log.noGeo'), true); return setMode('sim'); }
    gpsWatch = navigator.geolocation.watchPosition(
      p => setPos(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
      e => { log(t('log.gps', {m: e.message}), true); },
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
  } else if (!state.pos || !quiet){
    const z = state.snap && state.snap.zones[0];
    if (!state.pos && z && z.points.length){
      const c = z.points[0];
      setPos(c[0] - 0.0018, c[1], 5);                    // ~200 m south of the first zone
    }
  }
}
function nudge(dn, de){
  if (state.mode !== 'sim' || !state.pos) return;
  const m = state.simStep;
  const dLat = dn * m / 111320, dLon = de * m / (111320 * Math.cos(state.pos.lat * Math.PI/180));
  setPos(state.pos.lat + dLat, state.pos.lon + dLon, 5);
}

/* ------------------------------------------------------------------ modals */
function showMessage(id, text, media, buttons){
  const img = mediaUrl(media);
  if (media && isAudio(media)) playAudio(media);
  $('#card').innerHTML = (img ? `<img src="${img}" alt="">` : '') + `<div class="desc">${rich(text)}</div>` +
    `<div class="btns">${buttons.map((b,i)=>`<button class="btn" data-i="${i}">${esc(u8safe(b))}</button>`).join('')}</div>`;
  $('#modal').hidden = false;
  $('#card').querySelectorAll('button').forEach(btn => btn.onclick = () => {
    const label = buttons[+btn.dataset.i];
    $('#modal').hidden = true;
    callLua('__W_btn', id, label);
    refresh(true);
  });
}
const u8safe = s => s;
function showInput(id, text, media, kind, choices){
  const img = mediaUrl(media);
  if (media && isAudio(media)) playAudio(media);
  let body;
  if (kind === 'MultipleChoice' && choices.length)
    body = `<div class="btns">${choices.map((c,i)=>`<button class="btn ghost" data-i="${i}">${esc(c)}</button>`).join('')}</div>`;
  else body = `<input type="text" id="inp" autocomplete="off" autocapitalize="off"><div class="btns"><button class="btn" id="inpok">${t('btn.ok')}</button></div>`;
  $('#card').innerHTML = (img ? `<img src="${img}" alt="">` : '') + `<div class="desc">${rich(text)}</div>` + body;
  $('#modal').hidden = false;
  const done = v => { $('#modal').hidden = true; callLua('__W_input', id, l1(v)); refresh(true); };
  if (kind === 'MultipleChoice' && choices.length)
    $('#card').querySelectorAll('button').forEach(b => b.onclick = () => done(choices[+b.dataset.i]));
  else { const inp = $('#inp'); setTimeout(()=>inp.focus(), 50); $('#inpok').onclick = () => done(inp.value);
    inp.onkeydown = e => { if (e.key === 'Enter') done(inp.value); }; }
}

/* ------------------------------------------------------------------ rendering */
function findEntity(id){
  const s = state.snap; if (!s) return null;
  for (const k of ['zones','yousee','inventory','tasks']) for (const e of s[k]) if (e.id === id) return e;
  return null;
}
const ARROW = '<svg class="arrow" viewBox="0 0 24 24"><path d="M12 2 L19 21 L12 17 L5 21 Z" fill="currentColor"/></svg>';

function listHTML(arr, opts){
  if (!arr.length) return `<div class="empty">${opts.empty}</div>`;
  return '<ul class="list">' + arr.map(e => {
    const img = mediaUrl(e.icon || e.media);
    const sub = opts.sub ? opts.sub(e) : '';
    return `<li><button class="item" data-id="${e.id}">${img ? `<img src="${img}" alt="">` : ''}<span class="t"><b>${esc(e.name || t('nameless'))}</b>${sub ? `<small>${sub}</small>` : ''}</span>${opts.right ? opts.right(e) : ''}</button></li>`;
  }).join('') + '</ul>';
}

function render(){
  const v = $('#view'); const s = state.snap;
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === state.tab && !state.detail));
  if (s && s.cart) $('#title').textContent = s.cart.name || 'WhereMeGo';
  if (['start', 'history', 'builder'].includes(state.tab)) $('#title').textContent = 'WhereMeGo';
  document.querySelectorAll('#nav .dot').forEach(d => d.remove());
  if (s) for (const [tab, n] of [['yousee', s.yousee.length], ['inv', s.inventory.length], ['tasks', s.tasks.filter(t=>!t.complete).length]]){
    if (n){ const b = document.querySelector(`#nav [data-tab=${tab}]`); b.insertAdjacentHTML('beforeend', `<span class="dot">${n}</span>`); }
  }
  if (state.tab === 'start') return renderStart(v);
  if (state.tab === 'history') return renderHistory(v);
  if (state.tab === 'builder') return renderBuilderTab(v);
  if (state.tab === 'intro') return renderIntro(v);
  if (state.detail) return renderDetail(v);
  switch (state.tab){
    case 'map': return renderMap(v);
    case 'zones': v.innerHTML = listHTML(s.zones, { empty: t('empty.zones'),
        sub: z => t('zone.' + z.state) === 'zone.' + z.state ? '' : t('zone.' + z.state),
        right: z => `<span style="color:var(--muted);text-align:right">${state.pos ? fmtDist(z.distance) : ''}</span><span style="color:var(--accent);transform:rotate(${Math.round(z.bearing)}deg)" class="arrow-wrap">${ARROW}</span>` }); break;
    case 'yousee': v.innerHTML = listHTML(s.yousee, { empty: t('empty.yousee') }); break;
    case 'inv': v.innerHTML = listHTML(s.inventory, { empty: t('empty.inv') }); break;
    case 'tasks': v.innerHTML = listHTML(s.tasks, { empty: t('empty.tasks'),
        sub: k => k.complete ? (k.correct === 'NotCorrect' ? t('task.failed') : t('task.done')) : t('task.open') }); break;
    case 'log': v.innerHTML = `<p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="savenow">${t('log.saveNow')}</button><button class="btn ghost" id="restart">${t('log.restart')}</button></p>
      <p class="muted" style="font-size:.85rem">${t('log.auto')}${state.savedAt ? t('log.last', {t: new Date(state.savedAt).toLocaleTimeString(locale())}) : ''}.</p>
      <pre class="log">${esc(logLines.join('\n') || t('log.empty'))}</pre>`;
      $('#savenow').onclick = () => { doSave(); log(t('log.saved')); };
      $('#restart').onclick = () => { if (confirm(t('log.confirmRestart'))){ stopAll(); clearSave(); startCartridge(state.gwc).then(() => beginPlay(false)); } };
      break;
  }
  v.querySelectorAll('.item').forEach(b => b.onclick = () => { state.detail = +b.dataset.id; render(); });
}

/* ---- small helpers for the front page ---- */
const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
             set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
             del(k){ try { localStorage.removeItem(k); } catch(e){} } };
const CFG = window.WMG_CONFIG || {};
const lastKey = () => ls.get('wheremego:last');
const isDone = key => ls.get('wheremego:done:' + key) === '1';
const savedGame = key => { try { const r = ls.get('wherigo:' + key); return r ? JSON.parse(r) : null; } catch(e){ return null; } };
const fmtDate = ts => new Date(ts).toLocaleString(locale(), { dateStyle: 'short', timeStyle: 'short' });

async function playFromLibrary(c, resume){
  state.fromBuilder = false;
  await startCartridge(parseGWC(c.buf));
  if (resume) beginPlay(true);
}

function loadScript(src){
  return new Promise((res, rej) => { const e = document.createElement('script'); e.src = src; e.onload = res; e.onerror = () => rej(new Error('cannot load ' + src)); document.head.appendChild(e); });
}
function renderBuilderTab(v){
  $('#nav').hidden = true; $('#modeSeg').hidden = true;
  if (window.WMGBuilder) return window.WMGBuilder.render(v);
  v.innerHTML = '<p class="muted">' + t('hist.loading') + '</p>';
  loadScript('builder.js').then(() => { if (state.tab === 'builder') render(); })
    .catch(e => { v.innerHTML = '<p class="err">' + esc(t('err', {m: e.message})) + '</p><button class="btn ghost" id="bb">' + t('btn.close') + '</button>'; $('#bb').onclick = () => { state.tab = 'start'; render(); }; });
}

function renderStart(v){
  $('#nav').hidden = true; $('#modeSeg').hidden = true;
  v.innerHTML = `<div class="hero"><h2>WhereMeGo</h2>
    <p class="muted">${t('start.tagline')}</p>
    <div id="resumeBox"></div>
    <p><button class="btn" id="pick">${t('start.pick')}</button></p>
    <div id="histBox"></div>
    <input type="file" id="file" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1">
    <p class="muted small">${t('start.drag')}</p>
    <p class="err" id="startErr"></p></div>`;
  const openBuf = async (buf, fname) => {
    state.fromBuilder = false;
    await startCartridge(parseGWC(buf));
    const title = (state.snap && state.snap.cart && state.snap.cart.name) || fname;
    cartSave({ key: state.key, file: fname, title, size: buf.byteLength, t: Date.now(), buf });
  };
  const load = async f => {
    if (!f) return;
    $('#startErr').textContent = t('start.loading', {name: f.name});
    try { await openBuf(await f.arrayBuffer(), f.name); }
    catch(err){ $('#startErr').textContent = t('err', {m: err.message || err}); console.error(err); }
  };
  cartAll().then(list => {
    if (state.tab !== 'start' || !list || !list.length) return;
    const cur = list.find(c => c.key === lastKey() && savedGame(c.key) && !isDone(c.key));
    if (cur){
      $('#resumeBox').innerHTML = `<p><button class="btn" id="resumeLast">${t('start.resume')}</button><br>
        <small class="muted">${esc(cur.title || cur.file)} · ${esc(t('start.savedAt', {d: fmtDate(savedGame(cur.key).t)}))}</small></p>`;
      $('#pick').classList.add('ghost');
      $('#resumeLast').onclick = async () => {
        try { await playFromLibrary(cur, true); } catch(err){ $('#startErr').textContent = t('err', {m: err.message || err}); }
      };
    }
    $('#histBox').innerHTML = `<p><button class="btn ghost" id="hist">${t('hist.btn', {n: list.length})}</button></p>`;
    $('#hist').onclick = () => { state.tab = 'history'; render(); };
  }).catch(() => {});
  $('#pick').onclick = () => { try { $('#file').click(); } catch(e){ $('#startErr').textContent = t('start.pickFail', {m: e.message}); } };
  $('#file').onchange = e => load(e.target.files[0]);
  document.body.ondragover = e => e.preventDefault();
  document.body.ondrop = e => { e.preventDefault(); if (state.tab === 'start') load(e.dataTransfer.files[0]); };
}

function renderHistory(v){
  $('#nav').hidden = true; $('#modeSeg').hidden = true;
  v.innerHTML = `<button class="back" id="home">${t('hist.home')}</button><h2 style="margin:.2em 0 .6em">${t('hist.title')}</h2><div id="hl"><p class="muted">${t('hist.loading')}</p></div><p style="margin-top:18px">${coffeeLink()}</p>`;
  $('#home').onclick = () => { state.tab = 'start'; render(); };
  cartAll().then(list => {
    if (state.tab !== 'history') return;
    if (!list || !list.length){ $('#hl').innerHTML = '<div class="empty">' + t('hist.empty') + '</div>'; return; }
    const played = c => +(ls.get('wheremego:played:' + c.key) || c.t || 0);
    list.sort((a, b) => played(b) - played(a));
    $('#hl').innerHTML = '<ul class="list">' + list.map((c, i) => {
      const sv = savedGame(c.key), done = isDone(c.key), open = sv && !done;
      const status = done ? t('hist.done') : sv ? t('hist.open', {d: fmtDate(sv.t)}) : t('hist.new');
      return `<li><div class="item col"><span class="t"><b>${esc(c.title || c.file)}</b><small>${esc(status)}</small>
        <small>${esc(c.file)} · ${(c.size / 1048576).toFixed(1)} MB</small></span>
        <span class="row">${open ? `<button class="btn sm" data-i="${i}" data-act="resume">${t('btn.continue')}</button>` : ''}
        <button class="btn sm ${open ? 'ghost' : ''}" data-i="${i}" data-act="new">${done ? t('btn.playAgain') : open ? t('btn.restart') : t('btn.start')}</button>
        <button class="btn sm ghost" data-i="${i}" data-act="del" aria-label="${esc(t('btn.delete'))}">${t('btn.delete')}</button></span></div></li>`;
    }).join('') + '</ul>';
    $('#hl').querySelectorAll('button[data-act]').forEach(b => b.onclick = async () => {
      const c = list[+b.dataset.i], act = b.dataset.act;

          if ((savedGame(c.key) || isDone(c.key)) && !confirm(t('hist.confirmNew'))) return;
          ls.del('wherigo:' + c.key); ls.del('wheremego:done:' + c.key);
          await playFromLibrary(c, false);
        } else if (act === 'del'){
          if (!confirm(t('hist.confirmDel'))) return;
          await cartDel(c.key); ls.del('wherigo:' + c.key); ls.del('wheremego:done:' + c.key); ls.del('wheremego:played:' + c.key);
          if (lastKey() === c.key) ls.del('wheremego:last');
          renderHistory(v);
        }
      } catch(err){ alert(t('err', {m: err.message || err})); }
    });
  }).catch(e => { $('#hl').innerHTML = '<div class="empty">' + esc(t('hist.readErr', {m: e && e.message || e})) + '</div>'; });
}

function renderIntro(v){

function renderDetail(v){

function runCmd(e, c){
  if (c.with){
    if (!c.targets.length){ showMessage(0, c.empty || t('cmd.nothing'), 0, [t('btn.ok')]); $('#card').querySelector('button').onclick = () => { $('#modal').hidden = true; }; return; }
    $('#card').innerHTML = `<div class="desc"><b>${esc(c.text)}</b> ${t('cmd.pick')}</div><div class="btns">` +
      c.targets.map(t => `<button class="btn ghost" data-id="${t.id}">${esc(t.name)}</button>`).join('') + `<button class="btn ghost" id="cancel">${t('btn.cancel')}</button></div>`;
    $('#modal').hidden = false;
    $('#card').querySelectorAll('button[data-id]').forEach(b => b.onclick = () => { $('#modal').hidden = true; callLua('__W_cmd', e.id, c.key, +b.dataset.id); refresh(true); });

/* ------------------------------------------------------------------ map (Leaflet + OpenStreetMap tiles) */
const TILE_URL = CFG.tileUrl || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
let lmap = null, mapWrap = null, tileLayer = null, you = null, accCircle = null, zoneLayers = {};
const tilesOn = () => ls.get('wheremego:tiles') !== 'off';

function resetMapLayers(){
  Object.values(zoneLayers).forEach(l => l.remove()); zoneLayers = {};
  if (you){ you.remove(); you = null; } if (accCircle){ accCircle.remove(); accCircle = null; }

function buildMap(){
  mapWrap = document.createElement('div');
  mapWrap.innerHTML = `<div id="mapbox"></div>
    <p style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0">
      <button class="btn ghost sm" id="recenter">${t('map.recenter')}</button>
      <button class="btn ghost sm" id="tilesBtn"></button></p>
    <div class="ctl" id="simctl">
      <div class="pad">
        <span></span><button data-d="1,0" aria-label="${t('map.north')}">↑</button><span></span>
        <button data-d="0,-1" aria-label="${t('map.west')}">←</button><span></span><button data-d="0,1" aria-label="${t('map.east')}">→</button>
        <span></span><button data-d="-1,0" aria-label="${t('map.south')}">↓</button><span></span>
      </div>
      <div><div class="muted" style="font-size:.8rem;margin-bottom:4px">${t('map.step')}</div>
        <div class="seg" id="stepSeg">${[5,10,25,100].map(n => `<button data-s="${n}">${n} m</button>`).join('')}</div>
        <p class="muted" style="font-size:.8rem;max-width:200px">${t('map.hint')}</p></div>
    </div>
    <p class="muted" id="posinfo" style="font-size:.85rem"></p>`;
  lmap = L.map(mapWrap.querySelector('#mapbox'), { maxZoom: 19, zoomSnap: 0.5 });
  tileLayer = L.tileLayer(TILE_URL, { maxZoom: 19, crossOrigin: true,
    attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' });
  if (tilesOn()) tileLayer.addTo(lmap);
  lmap.setView([58.6, 25], 7);
  lmap.on('click', ev => { if (state.mode === 'sim') setPos(ev.latlng.lat, ev.latlng.lng, 5); });
  lmap.on('dragstart', () => { state.follow = false; });
  mapWrap.querySelectorAll('.pad button[data-d]').forEach(b => b.onclick = () => { const [n, e] = b.dataset.d.split(',').map(Number); nudge(n, e); });
  mapWrap.querySelectorAll('#stepSeg button').forEach(b => b.onclick = () => { state.simStep = +b.dataset.s; syncMapControls(); });
  mapWrap.querySelector('#recenter').onclick = () => { state.follow = true; fitMap(); };
  mapWrap.querySelector('#tilesBtn').onclick = () => {
    if (tilesOn()){ ls.set('wheremego:tiles', 'off'); lmap.removeLayer(tileLayer); } else { ls.del('wheremego:tiles'); tileLayer.addTo(lmap); }
    syncMapControls();
  };
}
function syncMapControls(){
  mapWrap.querySelector('#simctl').hidden = state.mode !== 'sim';
  mapWrap.querySelectorAll('#stepSeg button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.s === state.simStep));
  mapWrap.querySelector('#tilesBtn').textContent = tilesOn() ? t('map.tilesOn') : t('map.tilesOff');
}
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function fitMap(){
  const s = state.snap; if (!s || !lmap) return;
  const pts = []; s.zones.forEach(z => z.points.forEach(p => pts.push(p)));
  if (state.pos) pts.push([state.pos.lat, state.pos.lon]);
  if (!pts.length) return;
  lmap.fitBounds(L.latLngBounds(pts), { padding: [34, 34], maxZoom: 18 });
  state.mapFitted = true;
}

function updateMap(){
  const s = state.snap; if (!s || !lmap) return;
  const zc = cssVar('--zone'), yc = cssVar('--you');
  const seen = {};
  s.zones.forEach(z => {
    if (!z.points.length) return;
    seen[z.id] = true;
    const ll = z.points.map(p => [p[0], p[1]]);
    const style = { color: zc, weight: 2, fillColor: zc, fillOpacity: z.state === 'Inside' ? 0.45 : 0.22 };
    let lyr = zoneLayers[z.id];
    if (lyr && lyr._n !== ll.length){ lyr.remove(); lyr = null; }
    if (!lyr){
      lyr = ll.length >= 3 ? L.polygon(ll, style) : ll.length === 2 ? L.polyline(ll, style) : L.circle(ll[0], Object.assign({ radius: 20 }, style));
      lyr.bindTooltip(z.name, { permanent: true, direction: 'center', className: 'zlabel' }).addTo(lmap);
      lyr._n = ll.length; zoneLayers[z.id] = lyr;
    } else {
      lyr.setStyle(style); lyr.setTooltipContent(z.name);
      if (ll.length >= 2) lyr.setLatLngs(ll); else lyr.setLatLng(ll[0]);
    }
  });
  Object.keys(zoneLayers).forEach(id => { if (!seen[id]){ zoneLayers[id].remove(); delete zoneLayers[id]; } });
  if (state.pos){
    const ll = [state.pos.lat, state.pos.lon];
    if (!you) you = L.circleMarker(ll, { radius: 8, color: '#ffffff', weight: 3, fillColor: yc, fillOpacity: 1 }).addTo(lmap);
    else you.setLatLng(ll);
    if (state.pos.acc > 12){
      if (!accCircle) accCircle = L.circle(ll, { radius: state.pos.acc, color: yc, weight: 1, fillColor: yc, fillOpacity: 0.1, interactive: false }).addTo(lmap);
      else { accCircle.setLatLng(ll); accCircle.setRadius(state.pos.acc); }
    } else if (accCircle){ accCircle.remove(); accCircle = null; }
  }
  if (!state.mapFitted) fitMap();
  else if (state.pos && state.follow && (state.mode === 'gps' || !lmap.getBounds().pad(-0.1).contains([state.pos.lat, state.pos.lon])))
    lmap.panTo([state.pos.lat, state.pos.lon]);
  const pi = mapWrap.querySelector('#posinfo');
  pi.textContent = state.pos ? t('map.pos', {lat: state.pos.lat.toFixed(5), lon: state.pos.lon.toFixed(5), acc: Math.round(state.pos.acc)}) : t('map.nopos');
}

function renderMap(v){
  if (!lmap) buildMap();
  if (v.firstChild !== mapWrap) v.replaceChildren(mapWrap);
  syncMapControls();
  lmap.invalidateSize();
  updateMap();
}
window.addEventListener('resize', () => { if (lmap && state.tab === 'map') lmap.invalidateSize(); });

/* ------------------------------------------------------------------ menu, about, end screen */
function closeModal(){ $('#modal').hidden = true; state.menuOpen = false; }
const coffeeLink = cls => CFG.donateUrl ? `<a class="btn ${cls === undefined ? 'ghost' : cls}" href="${esc(CFG.donateUrl)}" target="_blank" rel="noopener">☕ ${esc(CFG.donateText || t('coffee'))}</a>` : '';

function showMenu(){
  const playing = state.started && vm;
  $('#card').innerHTML = `<div class="btns" style="margin-top:0">
    ${playing ? `<button class="btn ghost" data-m="home">${state.fromBuilder ? t('menu.builderBack') : t('menu.home')}</button><button class="btn ghost" data-m="finish">${t('menu.finish')}</button>` : ''}
    <div class="row" style="align-items:center;margin-top:0"><span class="muted small">${t('menu.lang')}</span><span class="seg" id="langSeg"><button data-l="et" aria-pressed="${lang === 'et'}">Eesti</button><button data-l="en" aria-pressed="${lang === 'en'}">English</button></span></div>
    ${state.fromBuilder ? '' : `<button class="btn ghost" data-m="builder">${t('menu.builder')}</button>`}
    <button class="btn ghost" data-m="about">${t('menu.about')}</button>
    <button class="btn ghost" data-m="close">${t('btn.close')}</button>
    ${coffeeLink()}</div>`;
  state.menuOpen = true;
  $('#card').querySelectorAll('#langSeg button').forEach(b => b.onclick = () => setLang(b.dataset.l));
  $('#modal').hidden = false;
  $('#card').querySelectorAll('button[data-m]').forEach(b => b.onclick = () => {
    const m = b.dataset.m;
    if (m === 'close') closeModal();
    else if (m === 'about') showAbout();
    else if (m === 'home') goHome();
    else if (m === 'builder') openBuilder();
    else if (m === 'finish'){ closeModal(); if (confirm(t('menu.confirmFinish'))){ ls.set('wheremego:done:' + state.key, '1'); state.endShown = true; showEnd(); } }
  });
}

function setLang(l){
  lang = l; try { localStorage.setItem('wheremego:lang', l); } catch(e){}
  applyStatic();
  if (mapWrap){ mapWrap.remove(); lmap.remove(); lmap = null; mapWrap = null; zoneLayers = {}; you = null; accCircle = null; state.mapFitted = false; }
  showMenu(); render();
}

function goHome(){
  doSave(); stopAll(); state.started = false; vm = null; state.detail = null; state.tab = state.fromBuilder ? 'builder' : 'start';
  closeModal(); render();
}
function openBuilder(){
  if (state.started && vm){ doSave(); stopAll(); state.started = false; vm = null; }
  state.fromBuilder = false; state.detail = null; state.tab = 'builder'; closeModal(); render();
}

function showAbout(){
  $('#card').innerHTML = `<h2 style="margin:.1em 0">WhereMeGo</h2>
    <p class="small">${t('about.intro')}</p>
    <p class="small">${t('about.built', {moon: '<a href="https://github.com/gamesys/moonshine" target="_blank" rel="noopener">Moonshine</a>', leaf: '<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>', osm: '<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'})}</p>
    <p class="small muted">${t('about.tm')}</p>
    ${CFG.repoUrl ? `<p class="small"><a href="${esc(CFG.repoUrl)}" target="_blank" rel="noopener">${t('about.src')}</a></p>` : ''}
    <div class="btns"><button class="btn ghost" id="aboutClose">${t('btn.close')}</button>${coffeeLink()}</div>`;
  state.menuOpen = true; $('#modal').hidden = false; $('#aboutClose').onclick = closeModal;
}

function showEnd(){
  const name = (state.snap && state.snap.cart && state.snap.cart.name) || '';
  $('#card').innerHTML = `<h2 style="margin:.1em 0">${t('end.title')}</h2>
    <p class="desc"><b>${esc(name)}</b></p><p class="muted">${t('end.thanks')}</p>
    <div class="btns"><button class="btn ghost" id="endHome">${t('end.home')}</button><button class="btn ghost" id="endStay">${t('end.stay')}</button>${coffeeLink()}</div>`;
  state.menuOpen = true; $('#modal').hidden = false;
  $('#endHome').onclick = goHome; $('#endStay').onclick = closeModal;
}

/* ------------------------------------------------------------------ cartridge library (IndexedDB) */
const idbOpen = () => new Promise((res, rej) => {
  const r = indexedDB.open('wheremego', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('carts', { keyPath: 'key' });
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function idbTx(mode, fn){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('carts', mode); const rq = fn(tx.objectStore('carts'));
    tx.oncomplete = () => { db.close(); res(rq && rq.result); }; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
const cartAll = () => idbTx('readonly', s => s.getAll());
const cartDel = key => idbTx('readwrite', s => s.delete(key));
async function cartSave(rec){
  try { await idbTx('readwrite', s => s.put(rec)); if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }
  catch(e){ log(t('log.cartSaveFail', {m: e && e.message}), true); }
}

/* ------------------------------------------------------------------ offline (service worker) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(e => log(t('log.sw', {m: e.message}), true));
}

/* ------------------------------------------------------------------ wiring */
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { if (state.tab !== b.dataset.tab || state.detail){ (state.tabStack = state.tabStack || []).push(state.tab); if (state.tabStack.length > 30) state.tabStack.shift(); } state.tab = b.dataset.tab; state.detail = null; render(); });
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('#menuBtn').onclick = showMenu;
window.addEventListener('error', e => log(t('log.js', {m: e.message}), true));
window.addEventListener('unhandledrejection', e => log(t('err', {m: (e.reason && e.reason.message || e.reason)}), true));
applyStatic();
render();

/* ------------------------------------------------------------------ back button (browser / Android) */
function appBack(){
  if (state.menuOpen){ closeModal(); return true; }
  if (!$('#modal').hidden) return true;               // a game message is open: it must be answered with its buttons
  if (state.tab === 'builder'){ state.tab = 'start'; render(); return true; }
  if (state.tab === 'history' || state.tab === 'intro'){ if (state.tab === 'intro') { stopAll(); vm = null; } state.tab = (state.tab === 'intro' && state.fromBuilder) ? 'builder' : 'start'; render(); return true; }
  if (state.tab === 'start') return false;
  if (state.detail){ state.detail = null; render(); return true; }
  if (state.tabStack && state.tabStack.length){ state.tab = state.tabStack.pop(); render(); return true; }
  if (state.tab !== 'map'){ state.tab = 'map'; render(); return true; }
  showMenu(); return true;                              // game root: offer Home instead of silently leaving
}
const backGuard = () => { try { history.pushState({ wmg: 1 }, ''); } catch(e){} };
try { history.replaceState({ wmg: 0 }, ''); } catch(e){}
backGuard();
window.addEventListener('popstate', () => { if (appBack()) backGuard(); else history.back(); });
</script>
</body>
</html>
