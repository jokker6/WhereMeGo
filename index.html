<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wherigo mängija</title>
<style>
:root{
  --bg:#f4f1ea; --surface:#fffdf8; --ink:#1f2a24; --muted:#6a746d; --line:#ddd6c6;
  --accent:#1f6b4a; --accent-ink:#fff; --warn:#b4541a; --zone:#2f7a5a; --you:#c0392b;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141815; --surface:#1d231f; --ink:#e8ece6; --muted:#98a39b; --line:#2c352f;
    --accent:#4fb284; --accent-ink:#0c1410; --warn:#e0884f; --zone:#4fb284; --you:#ff6b5a;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));
  background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-size:1rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:10px 2px;font:inherit;font-size:.72rem;position:relative}
nav button b{display:block;font-size:1.15rem;font-weight:400}
nav button[aria-selected=true]{color:var(--accent);font-weight:600}
nav .dot{position:absolute;top:6px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--warn);
  color:#fff;font-size:.65rem;line-height:16px;padding:0 4px}
button.btn,label.btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  padding:11px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-align:center}
button.btn.ghost,label.btn.ghost{background:none;color:var(--accent)}
button.btn:disabled{opacity:.45}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px;width:100%;text-align:left;font:inherit;color:inherit}
.item img{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none}
.item .t{flex:1;min-width:0}.item .t b{display:block}.item .t small{color:var(--muted)}
.arrow{width:30px;height:30px;flex:none;transition:transform .3s}
.muted{color:var(--muted)} .center{text-align:center}
.empty{color:var(--muted);text-align:center;padding:32px 0}
.hero{max-width:520px;margin:6vh auto 0;text-align:center}
.hero h2{margin:.2em 0}
.hero img{max-width:100%;max-height:36vh;border-radius:14px;margin:12px 0}
.desc{white-space:pre-wrap;word-wrap:break-word}
.detail img{max-width:100%;border-radius:12px;margin:8px 0}
.cmds{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.back{background:none;border:0;color:var(--accent);font:inherit;padding:0 0 10px;font-weight:600}
canvas{width:100%;height:46vh;min-height:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;touch-action:none;display:block}
.ctl{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px}
.pad button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font-size:1.2rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:8px 12px;font:inherit;font-size:.85rem}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal .card{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.modal{align-items:center}.modal .card{border-radius:18px}}
.card img{max-width:100%;max-height:34vh;display:block;margin:0 auto 12px;border-radius:10px}
.card .btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.card input[type=text]{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:12px}
pre.log{font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:10px;margin:0}
.err{color:var(--warn)}
[hidden]{display:none!important}
</style>

'use strict';


var shine = shine || {};


(function (shine) {


	/**
	 * Constant empty object for use in comparisons, etc to avoid creating an object needlessly
	 * @type Object
	 * @constant
	 */
	shine.EMPTY_OBJ = {};


	/**
	 * Constant empty array for use in comparisons, etc to avoid creating an object needlessly
	 * @type Object
	 * @constant
	 */
	shine.EMPTY_ARR = [];




	/**
	 * Moonshine GC functions.
	 * @namespace
	 */
	shine.gc = { 


		/**
		 * Collected objects, empty and ready for reuse.
		 * @type Array
		 * @static
		 */
		objects: [],


		/**
		 * Collected objects, empty and ready for reuse.
		 * @type Array
		 * @static
		 */
		arrays: [],


		/**
		 * Number of objects and array that have been collected. Use for debugging.
		 * @type Number
		 * @static
		 */
		collected: 0,


		/**
		 * Number of objects and array that have been reused. Use for debugging.
		 * @type Number
		 * @static
		 */
		reused: 0,




		/**
		 * Prepare an array for reuse.
		 * @param {Array} arr Array to be used.
		 */
		cacheArray: function (arr) {
			arr.length = 0;
			this.arrays.push(arr);
			// this.collected++;
		},




		/**
		 * Prepare an object for reuse.
		 * @param {Object} obj Object to be used.
		 */
		cacheObject: function (obj) {
			for (var i in obj) if (obj.hasOwnProperty(i)) delete obj[i];
			this.objects.push(obj);
			// this.collected++;
		},




		/**
		 * Returns a clean array from the cache or creates a new one if cache is empty.
		 * @returns {Array} An empty array.
		 */
		createArray: function () {
			if (this.arrays.length) this.reused++;
			return this.arrays.pop() || [];
		},




		/**
		 * Returns a clean object from the cache or creates a new one if cache is empty.
		 * @returns {Object} An empty object.
		 */
		createObject: function () { 
			if (this.objects.length) this.reused++;
			return this.objects.pop() || {};
		},




		/**
		 * Reduces the number of references associated with an object by one and collect it if necessary.
		 * @param {Object} Any object.
		 */
		decrRef: function (val) {
			if (!val || !(val instanceof shine.Table) || val.__shine.refCount === undefined) return;
			if (--val.__shine.refCount == 0) this.collect(val);
		},




		/**
		 * Increases the number of references associated with an object by one.
		 * @param {Object} Any object.
		 */
		incrRef: function (val) {
			if (!val || !(val instanceof shine.Table) || val.__shine.refCount === undefined) return;
			val.__shine.refCount++;
		},




		/**
		 * Collect an object.
		 * @param {Object} Any object.
		 */
		collect: function (val) {
			if (val === undefined || val === null) return;
			if (val instanceof Array) return this.cacheArray(val);
			if (typeof val == 'object' && val.constructor == Object) return this.cacheObject(val);

			if (!(val instanceof shine.Table) || val.__shine.refCount === undefined) return;

			var i, l, 
				meta = val.__shine;

			for (i = 0, l = meta.keys.length; i < l; i++) this.decrRef(meta.keys[i]);
			for (i = 0, l = meta.values.length; i < l; i++) this.decrRef(meta.values[i]);
			for (i = 0, l = meta.numValues.length; i < l; i++) this.decrRef(meta.numValues[i]);

			this.cacheArray(meta.keys);
			this.cacheArray(meta.values);

			delete meta.keys;
			delete meta.values;

			this.cacheObject(meta);
			delete val.__shine;

			for (i in val) if (val.hasOwnProperty(i)) this.decrRef(val[i]);
		}


	};




})(shine || {});

'use strict';


var shine = shine || {};


/**
 * Abstract object that fires events.
 * @constructor
 */
shine.EventEmitter = function () {
	this._listeners = {};
};




/**
 * Triggers an event.
 * @param {string} name Name of the event.
 * @param {Array} [data = []] Array containing any associated data.
 */
shine.EventEmitter.prototype._trigger = function (name, data) {
	var listeners = this._listeners[name],
		result,
		i;
		
	if (!listeners) return;
	if (!((data || shine.EMPTY_OBJ) instanceof Array)) data = [data];
	
	for (i in listeners) {
		if (listeners.hasOwnProperty(i)) {
			result = listeners[i].apply(this, data);
			if (result !== undefined && !result) break;
		}
	}
};




/**
 * Adds an event listener.
 * @param {string} name Name of the event.
 * @param {Function} Callback Listener function.
 */
shine.EventEmitter.prototype.on = function (name, callback) {
	if (!this._listeners[name]) this._listeners[name] = [];
	this._listeners[name].push(callback);
}




/**
 * Removes an event listener.
 * @param {string} name Name of the event.
 * @param {Function} Callback Listener function to be removed.
 */
shine.EventEmitter.prototype.unbind = function (name, callback) {
	for (var i in this._listeners[name]) {
		if (this._listeners[name].hasOwnProperty(i) && this._listeners[name][i] === callback) this._listeners[name].splice(i, 1);
	}
}




if (typeof module == 'object' && module.exports) module.exports.EventEmitter = shine.EventEmitter;





// vm/src/FileManager.js:



'use strict';


var shine = shine || {};


/**
 * Handles loading packages and distilled scripts.
 * @constructor
 * @extends shine.EventEmitter
 */
shine.FileManager = function () {
	shine.EventEmitter.call(this);
	this._cache = {};
};


shine.FileManager.prototype = new shine.EventEmitter();
shine.FileManager.prototype.constructor = shine.FileManager;




/**
 * Loads a file or package.
 * @param {String|Object} url Url of distilled json file or luac byte code file, or the json or byte code itself, or an object tree.
 * @param {Function} callback Load successful callback.
 */
shine.FileManager.prototype.load = function (url, callback) {
	var me = this,
		data;


	function parse (data, url) {
		var tree;

		if (me.constructor._isJson(data)) {
			// JSON
			tree = JSON.parse(data);

		} else if (me.constructor._isLuac(data)) {
			// Raw Lua 5.1 byte code
			tree = me.constructor._parseLuac(data);
		}

		if (tree) {
			window.setTimeout(function () {		// Make sure all calls are async.
				if (url) me._cache[url] = tree;
				me._onSuccess(url || '', tree, callback);
			}, 1);
		}

		return !!tree;
	}


	function success (data) {
		if (!parse(data, url)) throw new Error('File contains non-parsable content: ' + url);
	}


	function error (code) {
		me._onError(code, callback);
	}


	switch (typeof url) {
		case 'string':

			if (!parse(url)) {
				// If not parseable, treat as filename
				if (data = this._cache[url]) {
					window.setTimeout(function () { me._onSuccess(url, data, callback); }, 1);
				} else {
					shine.utils.get(url, success, error);
				}
			}

			break;

	
		case 'object':
			this._onSuccess('', url, callback);
			break;


		default: 
			throw new TypeError('Can\'t load object of unknown type');
	}
};




/**
 * Handles a successful response from the server.
 * @param {String} data Response.
 */
shine.FileManager.prototype._onSuccess = function (url, data, callback) {
	var file, i;

	if (data.format == 'moonshine.package') {
		for (i in data.files) this._cache[i] = data.files[i];
		this._trigger('loaded-package', data);

		if (!(url = data.main)) return;
		if (!(data = data.files[url])) throw new ReferenceError("The package's main reference does not point to a filename within the package");
	}

	file = new shine.File(url, data);
	
	this._onFileLoaded(file, function () {
		callback(null, file);
	});
};




/**
 * Hook called when a distilled file is loaded successfully. Overridden by debug engine.
 * @param {String} data Response.
 */
shine.FileManager.prototype._onFileLoaded = function (file, callback) {
	callback();
};




/**
 * Handles an unsuccessful response from the server. Overridden by debug engine.
 * @param {Number} code HTTP resonse code.
 */
shine.FileManager.prototype._onError = function (code, callback) {
	callback(code);
};




/**
 * Checks if a value represents a JSON string.
 * @param {String} val String to be checked.
 * @returns {Boolean} Is a JSON string?
 */
shine.FileManager._isJson = function (val) {
	return /^({.*}|\[.*\])$/.test(val);
};




/**
 * Checks if a value represents a Lua 5.1 byte code.
 * @param {String} val String to be checked.
 * @returns {Boolean} Is byte code?
 */
shine.FileManager._isLuac = function (val) {
	return val.substr(0, 5) == String.fromCharCode(27, 76, 117, 97, 81);
};




/**
 * Parses a string containing valid Lua 5.1 byte code into a tree.
 * Note: Requires Moonshine Distillery and could return unexpected results if ArrayBuffer is not supported.
 * @param {String} data Byte code string.
 * @returns {Object} Tree repesenting the Lua script.
 * @throws {Error} If Moonshine's distillery is not available.
 */
shine.FileManager._parseLuac = function (data) {
	if (!shine.distillery) throw new Error('Moonshine needs the distillery to parse Lua byte code. Please include "distillery.moonshine.js" in the page.');
	if (!('ArrayBuffer' in window)) console.warn('Browser does not support ArrayBuffers, this could cause unexpected results when loading binary files.');
	return new shine.distillery.Parser().parse(data);
};




/**
 * Dump memory associated with FileManager.
 */
shine.FileManager.prototype.dispose = function () {
	delete this._cache;
};

'use strict';


(function (shine) {


	/**
	 * A Lua virtual machine.
	 * @constructor
	 * @extends shine.EventEmitter
	 * @param {object} env Object containing global variables and methods from the host.
	 */

		this._env = env || {};

		this._coroutineStack = [];

	shine.VM.prototype.constructor = shine.VM;

	shine.SUSPENDING = 1;
	shine.SUSPENDED = 2;
	shine.RESUMING = 3;

		// Load environment vars
		for (var i in this._env) if (this._env.hasOwnProperty(i)) this._globals[i] = this._env[i];
	};

		for (var i in lib) {
			if (lib.hasOwnProperty(i)) {

				// if (lib[i] && lib[i].constructor === shine.Table) {

	 * @param {string} url The url of the file to load.
	 * @param {boolean} [execute = true] Whether or not to execute the file once loaded.
	 * @param {object} [coConfig] Coroutine configuration. Only applicable if execute == true.
	 */
	shine.VM.prototype.load = function (url, execute, coConfig) {
		var me = this;

		this.fileManager.load(url, function (err, file) {
			if (err) throw new URIError('Failed to load file: ' + url + ' (' + err + ')');

			me._trigger('file-loaded', file);
			if (execute || execute === undefined) me.execute(coConfig, file);
		});
	};




	/**
	 * Executes the loaded Luac data.
	 * @param {object} [coConfig] Coroutine configuration.
	 * @param {shine.File} [file] A specific file to execute. If not present, executes all files in the order loaded.
	 */
	shine.VM.prototype.execute = function (coConfig, file) {
		var me = this,
			files = file? [file] : this._files,
			index,
			file,
			thread;


		if (!files.length) throw new Error ('No files loaded.'); 
		
		for (index in files) {
			if (files.hasOwnProperty(index)) {

				file = files[index];		
				if (!file.data) throw new Error('Tried to execute file before data loaded.');
			
			
				thread = this._thread = new shine.Function(this, file, file.data, this._globals);
				this._trigger('executing', [thread, coConfig]);
				
				try {
					if (!coConfig) {
						thread.call ();
						
					} else {
						var co = shine.lib.coroutine.wrap.call(this, thread),
							resume = function () {
								co();
								if (coConfig.uiOnly && co._coroutine.status != shine.DEAD) window.setTimeout(resume, 1);
							};
			
						resume();
					}
					
				} catch (e) {
					shine.Error.catchExecutionError(e);
				}
			}
		}
	};

	 * Creates or updates a global in the guest environment.
	 * @param {String} name Name of the global variable.
	 * @param {Object} value Value.
	 */
	shine.VM.prototype.setGlobal = function (name, value) {
		this._globals[name] = value;
	};




	/**
	 * Retrieves a global from the guest environment.
	 * @param {String} name Name of the global variable.
	 * @returns {Object} Value of the global variable.
	 */
	shine.VM.prototype.getGlobal = function (name) {
		return this._globals[name];
	};




	/**
	 * Suspends any execution in the VM.
	 */
	shine.VM.prototype.suspend = function () {
		if (this._status !== shine.RUNNING) throw new Error('attempt to suspend a non-running VM');

		var vm = this;

		this._status = shine.SUSPENDING;
		this._resumeVars = undefined;

		window.setTimeout(function () {
			if (vm._status == shine.SUSPENDING) vm._status = shine.SUSPENDED;
		}, 1);
	};




	/**
	 * Resumes execution in the VM from the point at which it was suspended.
	 */
	shine.VM.prototype.resume = function (retvals) {
		if (this._status !== shine.SUSPENDED && this._status !== shine.SUSPENDING) throw new Error('attempt to resume a non-suspended VM');

		if (!arguments.length || retvals !== undefined) retvals = retvals || this._resumeVars;

		if (retvals && !(retvals instanceof Array)) {
			var arr = shine.gc.createArray();
			arr.push(retvals);
			retvals = arr;
		}

		this._status = shine.RESUMING;
		this._resumeVars = retvals;

		var f = this._resumeStack.pop();

		if (f) {
			try {
				if (f instanceof shine.Coroutine) {
					f.resume();
				} else if (f instanceof shine.Closure) {
					f._run();
				} else {
					f();
				}
				
			} catch (e) {

					var stack = (e.stack || '');

/* ------------------------------------------------------------------ helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const u8 = s => new TextDecoder().decode(Uint8Array.from(s, c => c.charCodeAt(0) & 255));   // Lua byte string -> text
const l1 = s => unescape(encodeURIComponent(s));                                            // text -> Lua byte string
const b64bin = b => { const t = atob(b); return t; };
const logLines = [];
function log(msg, err){ const t = new Date().toLocaleTimeString(); logLines.push((err?'! ':'')+t+'  '+msg);
  if (logLines.length > 400) logLines.shift(); if (state.tab === 'log') render(); }
// Urwigo escapes <BR> as text; turn the common markup into plain, safe HTML
function rich(s){
  s = String(s).replace(/&lt;br\s*\/?&gt;/gi,'\n').replace(/<br\s*\/?>/gi,'\n').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ');
  s = s.replace(/<[^>]*>/g,'');
  return esc(s).replace(/\n{3,}/g,'\n\n').trim();
}
function fmtDist(m){ if (m < 0) return '–'; if (m < 1000) return Math.round(m)+' m'; return (m/1000).toFixed(1)+' km'; }

/* ------------------------------------------------------------------ GWC parser */
function parseGWC(buf){
  const dv = new DataView(buf), u8a = new Uint8Array(buf);
  const sig = [2,10,0x43,0x41,0x52,0x54,0];
  for (let i=0;i<7;i++) if (u8a[i] !== sig[i]) throw new Error('See ei ole GWC-fail (signatuur ei klapi).');
  const n = dv.getUint16(7, true);
  const table = [];
  for (let i=0;i<n;i++) table.push({ id: dv.getUint16(9+i*6, true), off: dv.getUint32(11+i*6, true) });
  // object 0 = Lua bytecode: u32 length + data (no validity byte / type)
  const lo = table[0].off, llen = dv.getUint32(lo, true);
  let lua = '';
  const bytes = u8a.subarray(lo+4, lo+4+llen);
  for (let i=0;i<bytes.length;i+=8192) lua += String.fromCharCode.apply(null, bytes.subarray(i, i+8192));
  const medias = {};
  const MIME = {1:'image/bmp',2:'image/png',3:'image/jpeg',4:'image/gif',17:'audio/wav',18:'audio/mpeg',19:'audio/x-fdl',20:'audio/x-snd',21:'audio/ogg'};
  for (let i=1;i<n;i++){
    const o = table[i].off;
    if (!u8a[o]) continue;                             // invalid object
    const type = dv.getInt32(o+1, true), len = dv.getUint32(o+5, true);
    medias[table[i].id] = { type, mime: MIME[type] || 'application/octet-stream',
      blob: new Blob([u8a.slice(o+9, o+9+len)], { type: MIME[type] || 'application/octet-stream' }) };
  }
  return { lua, medias, count: n };
}

/* ------------------------------------------------------------------ Lua / Moonshine bridge */
const state = { tab:'start', mode:'sim', pos:null, snap:null, snapJson:'', detail:null, started:false,
  medias:{}, urls:{}, simStep:10, pickTarget:null, screenReq:null };
let vm = null, timer = null, saveInterval = null, gpsWatch = null, current = null, lastTick = 0, wakeLock = null, audioEl = null;

function mediaUrl(idx){
  if (!idx) return '';
  if (state.urls[idx] === undefined){
    const m = state.medias[idx];
    state.urls[idx] = (m && m.mime.startsWith('image/')) ? URL.createObjectURL(m.blob) : '';
  }
  return state.urls[idx];
}

function callLua(name, ...args){
  try {
    const f = vm._globals[name];
    if (!f) throw new Error('Lua-funktsiooni '+name+' pole');
    const r = f.apply(null, args);
    return r && r[0];
  } catch(e){ log('Lua viga ('+name+'): '+(e && e.message || e), true); return undefined; }
}

function loadChunk(str){
  return new Promise((res, rej) => {
    vm.fileManager.load(str, (err, file) => {
      if (err) return rej(new Error('Baitkoodi ei saanud laadida ('+err+')'));
      try { vm.execute(undefined, file); res(); } catch(e){ rej(e); }
    });
  });
}

async function startCartridge(gwc){
  stopAll(); state.gwc = gwc;
  state.medias = gwc.medias; state.urls = {}; state.snap = null; state.snapJson = ''; state.detail = null; state.started = false;
  vm = new shine.VM({});
  vm.setGlobal('__H_log', t => log(u8(t)));
  vm.setGlobal('__H_message', (id, text, media, buttons) => showMessage(id, u8(text), media, u8(buttons).split('\x1f')));
  vm.setGlobal('__H_input', (id, text, media, kind, choices) => showInput(id, u8(text), media, kind, u8(choices).split('\x1f').filter(Boolean)));
  vm.setGlobal('__H_screen', (screen, id) => { state.screenReq = { screen, id }; });
  vm.setGlobal('__H_audio', idx => playAudio(idx));
  // the Lua side cannot enumerate its own globals in Moonshine, so the host hands out a copy for save/restore
  vm.setGlobal('__H_globals', () => {
    const o = {};
    for (const k in vm._globals){ const v = vm._globals[k];
      if (v instanceof shine.Table || ['number','string','boolean'].includes(typeof v)) o[k] = v; }
    return new shine.Table(o);
  });
  vm.setGlobal('__H_setglobal', (k, v) => { vm._globals[k] = v; });
  state.key = hashStr(gwc.lua) + '-' + gwc.lua.length;
  await loadChunk(b64bin(WHERIGO_LUAC_B64));
  await loadChunk(gwc.lua);
  refresh(true);
  state.tab = 'intro'; render();
}

function beginPlay(resume){
  state.started = true;
  $('#nav').hidden = false; $('#modeSeg').hidden = false;
  state.tab = 'map';
  const sv = resume ? getSave() : null;
  if (sv){
    try {
      callLua('__W_restore', new shine.Table(JSON.parse(sv.data)));
      state.pos = sv.pos || null;
      if (state.pos) setPos(state.pos.lat, state.pos.lon, state.pos.acc);
      log('Mäng taastatud (salvestatud '+new Date(sv.t).toLocaleString()+')');
    } catch(e){ log('Taastamine ebaõnnestus: '+e.message, true); }
    setMode(state.mode, true);
  } else {
    clearSave(); state.pos = null;
    setMode(state.mode, true);
    callLua('__W_start');
  }
  lastTick = Date.now();
  timer = setInterval(() => { tickNow(); refresh(); }, 1000);
  saveInterval = setInterval(doSave, 20000);
  acquireWakeLock();
  refresh(true);
}

/* ---- time: tick with real elapsed seconds so timers catch up after the page was in the background ---- */
function tickNow(){
  const now = Date.now(), dt = Math.min((now - lastTick) / 1000, 6 * 3600); lastTick = now;
  if (dt > 0) callLua('__W_tick', dt);
}
async function acquireWakeLock(){
  try {
    if (!navigator.wakeLock || !state.started || document.hidden || wakeLock) return;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch(e){ log('Ekraani ärkvel hoidmine ei õnnestu: ' + e.message); }
}

/* ---- audio ---- */
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
let audioUnlocked = false;
function unlockAudio(){ if (audioUnlocked) return; audioUnlocked = true; try { const a = new Audio(SILENT_WAV); a.play().catch(() => {}); } catch(e){} }
document.addEventListener('pointerdown', unlockAudio, { once: true });
function isAudio(idx){ const m = state.medias[idx]; return !!(m && m.mime.startsWith('audio/')); }
function stopAudio(){ if (audioEl){ try { audioEl.pause(); } catch(e){} audioEl = null; } }
function playAudio(idx){
  const m = state.medias[idx];
  if (!m) { log('Heli ' + idx + ' puudub kassetist', true); return; }
  if (!m.mime.startsWith('audio/')) return;
  const names = { 17: 'WAV', 18: 'MP3', 19: 'FDL (Garmin)', 20: 'SND', 21: 'OGG' };
  if (m.type === 19 || m.type === 20 || !new Audio().canPlayType(m.mime)){
    log('Heli ' + idx + ' (' + (names[m.type] || m.mime) + ') pole selles brauseris toetatud', true); return; }
  stopAudio();
  try {
    audioEl = new Audio(URL.createObjectURL(m.blob));
    audioEl.play().catch(e => log('Heli ei käivitu: ' + e.message + ' (puuduta ekraani ja proovi uuesti)', true));
  } catch(e){ log('Heli viga: ' + e.message, true); }
}

function hashStr(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0).toString(16); }
function getSave(){ try { const r = localStorage.getItem('wherigo:'+state.key); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function doSave(){
  if (!vm || !state.started) return;
  const raw = callLua('__W_save'); if (typeof raw !== 'string' || !raw) return;
  try { localStorage.setItem('wherigo:'+state.key, JSON.stringify({ t: Date.now(), pos: state.pos, data: raw })); state.savedAt = Date.now(); }
  catch(e){ log('Salvestamine ebaõnnestus: '+e.message, true); }
}
function clearSave(){ try { localStorage.removeItem('wherigo:'+state.key); } catch(e){} }
let saveTimer = null;
function saveSoon(){ if (saveTimer) return; saveTimer = setTimeout(() => { saveTimer = null; doSave(); }, 3000); }
window.addEventListener('pagehide', doSave);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) doSave();
  else if (state.started && vm){ tickNow(); refresh(); acquireWakeLock(); }
});

function stopAll(){
  if (timer) clearInterval(timer); timer = null;
  if (saveInterval) clearInterval(saveInterval); saveInterval = null;
  stopAudio(); if (wakeLock){ try { wakeLock.release(); } catch(e){} wakeLock = null; }
  if (gpsWatch != null && navigator.geolocation) navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null;
  $('#modal').hidden = true;
}

function refresh(force){
  if (!vm) return;
  const raw = callLua('__W_snapshot');
  if (typeof raw !== 'string') return;
  if (!force && raw === state.snapJson && !state.screenReq) return;
  state.snapJson = raw; saveSoon();
  try { state.snap = JSON.parse(u8(raw)); } catch(e){ log('Snapshot parse: '+e.message, true); return; }
  if (state.screenReq){ applyScreen(state.screenReq); state.screenReq = null; }
  render();
}

function applyScreen({screen, id}){
  const map = {0:'map', 1:'zones', 2:'yousee', 3:'inv', 4:'tasks'};
  if (screen === 5 && id) { state.detail = id; }
  else if (map[screen]) { state.tab = map[screen]; state.detail = null; }
}

/* ------------------------------------------------------------------ position */
function setPos(lat, lon, acc){
  state.pos = { lat, lon, acc: acc || 5 };
  callLua('__W_pos', lat, lon, acc || 5);
  refresh(true);
}
function setMode(mode, quiet){
  state.mode = mode;
  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  if (gpsWatch != null){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; }
  if (mode === 'gps'){
    if (!navigator.geolocation){ log('Brauser ei toeta asukohta', true); return setMode('sim'); }
    gpsWatch = navigator.geolocation.watchPosition(
      p => setPos(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
      e => { log('GPS: '+e.message+' (kas leht on HTTPS-il ja luba antud?)', true); },
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
  } else if (!state.pos || !quiet){
    const z = state.snap && state.snap.zones[0];
    if (!state.pos && z && z.points.length){
      const c = z.points[0];
      setPos(c[0] - 0.0018, c[1], 5);                    // ~200 m south of the first zone
    }
  }
}
function nudge(dn, de){
  if (state.mode !== 'sim' || !state.pos) return;
  const m = state.simStep;
  const dLat = dn * m / 111320, dLon = de * m / (111320 * Math.cos(state.pos.lat * Math.PI/180));
  setPos(state.pos.lat + dLat, state.pos.lon + dLon, 5);
}

/* ------------------------------------------------------------------ modals */
function showMessage(id, text, media, buttons){
  const img = mediaUrl(media);
  if (media && isAudio(media)) playAudio(media);
  $('#card').innerHTML = (img ? `<img src="${img}" alt="">` : '') + `<div class="desc">${rich(text)}</div>` +
    `<div class="btns">${buttons.map((b,i)=>`<button class="btn" data-i="${i}">${esc(u8safe(b))}</button>`).join('')}</div>`;
  $('#modal').hidden = false;
  $('#card').querySelectorAll('button').forEach(btn => btn.onclick = () => {
    const label = buttons[+btn.dataset.i];
    $('#modal').hidden = true;
    callLua('__W_btn', id, label);
    refresh(true);
  });
}
const u8safe = s => s;
function showInput(id, text, media, kind, choices){
  const img = mediaUrl(media);
  if (media && isAudio(media)) playAudio(media);
  let body;
  if (kind === 'MultipleChoice' && choices.length)
    body = `<div class="btns">${choices.map((c,i)=>`<button class="btn ghost" data-i="${i}">${esc(c)}</button>`).join('')}</div>`;
  else body = `<input type="text" id="inp" autocomplete="off" autocapitalize="off"><div class="btns"><button class="btn" id="inpok">OK</button></div>`;
  $('#card').innerHTML = (img ? `<img src="${img}" alt="">` : '') + `<div class="desc">${rich(text)}</div>` + body;
  $('#modal').hidden = false;
  const done = v => { $('#modal').hidden = true; callLua('__W_input', id, l1(v)); refresh(true); };
  if (kind === 'MultipleChoice' && choices.length)
    $('#card').querySelectorAll('button').forEach(b => b.onclick = () => done(choices[+b.dataset.i]));
  else { const inp = $('#inp'); setTimeout(()=>inp.focus(), 50); $('#inpok').onclick = () => done(inp.value);
    inp.onkeydown = e => { if (e.key === 'Enter') done(inp.value); }; }
}

/* ------------------------------------------------------------------ rendering */
function findEntity(id){
  const s = state.snap; if (!s) return null;
  for (const k of ['zones','yousee','inventory','tasks']) for (const e of s[k]) if (e.id === id) return e;
  return null;
}
const ARROW = '<svg class="arrow" viewBox="0 0 24 24"><path d="M12 2 L19 21 L12 17 L5 21 Z" fill="currentColor"/></svg>';

function listHTML(arr, opts){
  if (!arr.length) return `<div class="empty">${opts.empty}</div>`;
  return '<ul class="list">' + arr.map(e => {
    const img = mediaUrl(e.icon || e.media);
    const sub = opts.sub ? opts.sub(e) : '';
    return `<li><button class="item" data-id="${e.id}">${img ? `<img src="${img}" alt="">` : ''}<span class="t"><b>${esc(e.name || '(nimeta)')}</b>${sub ? `<small>${sub}</small>` : ''}</span>${opts.right ? opts.right(e) : ''}</button></li>`;
  }).join('') + '</ul>';
}

function render(){
  const v = $('#view'); const s = state.snap;
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === state.tab && !state.detail));
  if (s && s.cart) $('#title').textContent = s.cart.name || 'Wherigo mängija';
  document.querySelectorAll('#nav .dot').forEach(d => d.remove());
  if (s) for (const [tab, n] of [['yousee', s.yousee.length], ['inv', s.inventory.length], ['tasks', s.tasks.filter(t=>!t.complete).length]]){
    if (n){ const b = document.querySelector(`#nav [data-tab=${tab}]`); b.insertAdjacentHTML('beforeend', `<span class="dot">${n}</span>`); }
  }
  if (state.tab === 'start') return renderStart(v);
  if (state.tab === 'intro') return renderIntro(v);
  if (state.detail) return renderDetail(v);
  switch (state.tab){
    case 'map': return renderMap(v);
    case 'zones': v.innerHTML = listHTML(s.zones, { empty: 'Aktiivseid asukohti pole.',
        sub: z => ({Inside:'Oled sees',Proximity:'Lähedal',Distant:'Kaugel',NotInRange:'Ulatusest väljas'})[z.state] || '',
        right: z => `<span style="color:var(--muted);text-align:right">${state.pos ? fmtDist(z.distance) : ''}</span><span style="color:var(--accent);transform:rotate(${Math.round(z.bearing)}deg)" class="arrow-wrap">${ARROW}</span>` }); break;
    case 'yousee': v.innerHTML = listHTML(s.yousee, { empty: 'Siin pole midagi näha.' }); break;
    case 'inv': v.innerHTML = listHTML(s.inventory, { empty: 'Varustus on tühi.' }); break;
    case 'tasks': v.innerHTML = listHTML(s.tasks, { empty: 'Ülesandeid pole.',
        sub: t => t.complete ? (t.correct === 'NotCorrect' ? 'Ebaõnnestus' : 'Tehtud') : 'Pooleli' }); break;
    case 'log': v.innerHTML = `<p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="savenow">Salvesta kohe</button><button class="btn ghost" id="restart">Alusta otsast</button></p>
      <p class="muted" style="font-size:.85rem">Mäng salvestub automaatselt selles brauseris${state.savedAt ? ' (viimati '+new Date(state.savedAt).toLocaleTimeString()+')' : ''}.</p>
      <pre class="log">${esc(logLines.join('\n') || '(tühi)')}</pre>`;
      $('#savenow').onclick = () => { doSave(); log('Salvestatud'); };
      $('#restart').onclick = () => { if (confirm('Kustutan salvestuse ja alustan kasseti otsast?')){ stopAll(); clearSave(); startCartridge(state.gwc).then(() => beginPlay(false)); } };
      break;
  }
  v.querySelectorAll('.item').forEach(b => b.onclick = () => { state.detail = +b.dataset.id; render(); });
}

function renderStart(v){
  $('#nav').hidden = true; $('#modeSeg').hidden = true;
  v.innerHTML = `<div class="hero"><h2>Wherigo mängija</h2>
    <p class="muted">Ava oma .gwc-kassett. Kassett jääb sinu brauserisse, midagi ei saadeta serverisse.</p>
    <p><button class="btn" id="pick">Vali kassett</button></p>
    <input type="file" id="file" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1">
    <p class="muted" style="font-size:.85rem">Kui nupp ei tee midagi, lohista .gwc-fail siia lehele.</p>
    <p class="err" id="startErr"></p></div>`;
  const load = async f => {
    if (!f) return;
    $('#startErr').textContent = 'Laen: ' + f.name + ' …';
    try { await startCartridge(parseGWC(await f.arrayBuffer())); }
    catch(err){ $('#startErr').textContent = 'Viga: ' + (err.message || err); console.error(err); }
  };
  $('#pick').onclick = () => { try { $('#file').click(); } catch(e){ $('#startErr').textContent = 'Failivalija ei avane: ' + e.message; } };
  $('#file').onchange = e => load(e.target.files[0]);
  document.body.ondragover = e => e.preventDefault();
  document.body.ondrop = e => { e.preventDefault(); if (state.tab === 'start') load(e.dataTransfer.files[0]); };
}

function renderIntro(v){
  const c = state.snap && state.snap.cart || {};
  const img = mediaUrl(c.media), sv = getSave();
  v.innerHTML = `<div class="hero">${img ? `<img src="${img}" alt="">` : ''}<h2>${esc(c.name || '')}</h2>
    <div class="desc" style="text-align:left">${rich(c.desc || '')}</div>
    ${sv ? `<p><button class="btn" id="resume">Jätka mängu</button><br><small class="muted">salvestatud ${esc(new Date(sv.t).toLocaleString())}</small></p>
    <p><button class="btn ghost" id="go">Alusta otsast</button></p>` : `<p><button class="btn" id="go">Alusta</button></p>`}
    <p><button class="btn ghost" id="other">Vali teine kassett</button></p></div>`;
  if (sv) $('#resume').onclick = () => beginPlay(true);
  $('#go').onclick = () => beginPlay(false);
  $('#other').onclick = () => { stopAll(); vm = null; state.tab = 'start'; render(); };
}

function renderDetail(v){
  const e = findEntity(state.detail);
  if (!e){ state.detail = null; return render(); }
  const img = mediaUrl(e.media);
  v.innerHTML = `<div class="detail"><button class="back" id="back">← Tagasi</button>
    <h2 style="margin:.2em 0">${esc(e.name)}</h2>${img ? `<img src="${img}" alt="">` : ''}${isAudio(e.media) ? `<p><button class="btn ghost" id="snd">▶ Esita heli</button></p>` : ''}
    <div class="desc">${rich(e.desc)}</div>
    <div class="cmds">${e.cmds.map((c,i)=>`<button class="btn ${c.enabled?'':'ghost'}" data-i="${i}" ${c.enabled?'':'disabled'}>${esc(c.text)}</button>`).join('')}</div></div>`;
  $('#back').onclick = () => { state.detail = null; render(); };
  if ($('#snd')) $('#snd').onclick = () => playAudio(e.media);
  v.querySelectorAll('.cmds button').forEach(b => b.onclick = () => runCmd(e, e.cmds[+b.dataset.i]));
}

function runCmd(e, c){
  if (c.with){
    if (!c.targets.length){ showMessage(0, c.empty || 'Pole midagi saadaval.', 0, ['OK']); $('#card').querySelector('button').onclick = () => { $('#modal').hidden = true; }; return; }
    $('#card').innerHTML = `<div class="desc"><b>${esc(c.text)}</b> – vali sihtmärk</div><div class="btns">` +
      c.targets.map(t => `<button class="btn ghost" data-id="${t.id}">${esc(t.name)}</button>`).join('') + `<button class="btn ghost" id="cancel">Tühista</button></div>`;
    $('#modal').hidden = false;
    $('#card').querySelectorAll('button[data-id]').forEach(b => b.onclick = () => { $('#modal').hidden = true; callLua('__W_cmd', e.id, c.key, +b.dataset.id); refresh(true); });
    $('#cancel').onclick = () => { $('#modal').hidden = true; };
    return;
  }
  callLua('__W_cmd', e.id, c.key, 0);
  refresh(true);
}

/* ------------------------------------------------------------------ map (no tiles: polygons + you) */
let mapView = null;
function renderMap(v){
  if (!v.querySelector('canvas')){
    v.innerHTML = `<canvas id="cv"></canvas>
      <div class="ctl" id="simctl">
        <div class="pad">
          <span></span><button data-d="1,0" aria-label="Põhja">↑</button><span></span>
          <button data-d="0,-1" aria-label="Läände">←</button><span></span><button data-d="0,1" aria-label="Itta">→</button>
          <span></span><button data-d="-1,0" aria-label="Lõunasse">↓</button><span></span>
        </div>
        <div><div class="muted" style="font-size:.8rem;margin-bottom:4px">Samm</div>
          <div class="seg" id="stepSeg">${[5,10,25,100].map(n=>`<button data-s="${n}">${n} m</button>`).join('')}</div>
          <p class="muted" style="font-size:.8rem;max-width:200px">Simulatsioonis saad ka kaardil klõpsata, et liikuda.</p></div>
      </div>
      <p class="muted" id="posinfo" style="font-size:.85rem"></p>`;
    v.querySelectorAll('.pad button[data-d]').forEach(b => b.onclick = () => { const [n,e] = b.dataset.d.split(',').map(Number); nudge(n,e); });
    v.querySelectorAll('#stepSeg button').forEach(b => b.onclick = () => { state.simStep = +b.dataset.s; renderMap(v); });
    $('#cv').addEventListener('pointerdown', ev => {
      if (state.mode !== 'sim' || !mapView) return;
      const r = ev.target.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
      setPos(mapView.lat0 - (y - mapView.cy) / mapView.k, mapView.lon0 + (x - mapView.cx) / (mapView.k * mapView.cosl), 5);
    });
  }
  $('#simctl').hidden = state.mode !== 'sim';
  v.querySelectorAll('#stepSeg button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.s === state.simStep));
  drawMap();
}

function drawMap(){
  const cv = $('#cv'); if (!cv) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const s = state.snap; if (!s) return;
  const pts = []; s.zones.forEach(z => z.points.forEach(p => pts.push(p)));
  if (state.pos) pts.push([state.pos.lat, state.pos.lon]);
  if (!pts.length) { g.fillStyle = css('--muted'); g.fillText('Kaardil pole midagi näidata', 16, 24); return; }
  let la0 = 90, la1 = -90, lo0 = 180, lo1 = -180;
  pts.forEach(p => { la0 = Math.min(la0, p[0]); la1 = Math.max(la1, p[0]); lo0 = Math.min(lo0, p[1]); lo1 = Math.max(lo1, p[1]); });
  const lat0 = (la0 + la1) / 2, lon0 = (lo0 + lo1) / 2, cosl = Math.cos(lat0 * Math.PI / 180);
  const spanY = Math.max(la1 - la0, 0.0006), spanX = Math.max((lo1 - lo0) * cosl, 0.0006);
  const k = Math.min((W - 60) / spanX / cosl, (H - 60) / spanY) ;        // px per degree of latitude
  const kx = k * cosl;
  mapView = { lat0, lon0, cx: W / 2, cy: H / 2, k: k, cosl };
  const X = lon => W / 2 + (lon - lon0) * kx, Y = lat => H / 2 - (lat - lat0) * k;
  // grid
  g.strokeStyle = css('--line'); g.lineWidth = 1;
  for (let i = 1; i < 6; i++){ g.beginPath(); g.moveTo(W*i/6,0); g.lineTo(W*i/6,H); g.moveTo(0,H*i/6); g.lineTo(W,H*i/6); g.stroke(); }
  g.font = '13px system-ui,sans-serif';
  s.zones.forEach(z => {
    if (!z.points.length) return;
    g.beginPath(); z.points.forEach((p, i) => i ? g.lineTo(X(p[1]), Y(p[0])) : g.moveTo(X(p[1]), Y(p[0]))); g.closePath();
    g.fillStyle = css('--zone') + (z.state === 'Inside' ? '88' : '44'); g.fill();
    g.strokeStyle = css('--zone'); g.lineWidth = 2; g.stroke();
    g.fillStyle = css('--ink'); g.fillText(z.name, X(z.points[0][1]) + 6, Y(z.points[0][0]) - 6);
  });
  if (state.pos){
    const px = X(state.pos.lon), py = Y(state.pos.lat);
    g.beginPath(); g.arc(px, py, 7, 0, 7); g.fillStyle = css('--you'); g.fill();
    g.lineWidth = 3; g.strokeStyle = css('--surface'); g.stroke();
  }
  const pi = $('#posinfo');
  if (pi) pi.textContent = state.pos ? `Asukoht: ${state.pos.lat.toFixed(5)}, ${state.pos.lon.toFixed(5)} (±${Math.round(state.pos.acc)} m)` : 'Asukohta pole veel (ootan GPS-i või simulatsiooni).';
}
window.addEventListener('resize', () => { if (state.tab === 'map') drawMap(); });

/* ------------------------------------------------------------------ wiring */
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.detail = null; render(); });
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
window.addEventListener('error', e => log('JS viga: ' + e.message, true));
window.addEventListener('unhandledrejection', e => log('Viga: ' + (e.reason && e.reason.message || e.reason), true));
render();
</script>
</body>
</html>
